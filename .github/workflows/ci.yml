name: CI

# The gate, on every pull request. Nothing here needs a secret: the site is
# static and has no environment of its own.
on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a branch/PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type-check, knip, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read-only verification first (ci:ts -> ci:knip), then the build that
      # actually ships. One job: the checks are seconds and share one install.
      - name: Run checks
        run: npm run ci

      - name: Build
        run: npm run build

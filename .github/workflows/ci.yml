name: CI

# The gate, on every pull request. Nothing here needs a secret: the site is
# static and has no environment of its own.
on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a branch/PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Types, lint, knip, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read-only verification first (ci:ts -> ci:lint -> ci:knip -> ci:format),
      # then the build that actually ships. `npm run ci` never rewrites files —
      # that is `npm run fix`, which belongs on a developer's machine, not here.
      # One job: the checks take seconds and share a single install.
      - name: Run checks
        run: npm run ci

      - name: Build
        run: npm run build
